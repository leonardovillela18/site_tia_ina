# Ambiente de staging: mesma imagem do site, porta e banco separados.
# Uso:
#   docker compose -f docker-compose.staging.yml up -d --build
#   docker compose -f docker-compose.staging.yml down
services:
  web:
    build: .
    image: tia-ina:staging
    container_name: tia_ina_staging
    restart: unless-stopped
    ports:
      - "127.0.0.1:8091:80"
    environment:
      BASE_URL: ${BASE_URL:-http://localhost:8091}
      DB_PATH: /var/www/html/data-staging/site.sqlite
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Site Tia Iná (staging)}
    volumes:
      - ./data-staging:/var/www/html/data-staging
      - ./img:/var/www/html/img
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 80) ? 0 : 1);"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 192m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

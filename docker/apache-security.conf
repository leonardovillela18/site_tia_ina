ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off

<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
    ErrorDocument 404 /404.php
</Directory>

# Nunca servir o banco SQLite nem arquivos sensiveis
<Directory /var/www/html/data>
    Require all denied
</Directory>

<FilesMatch "^\.">
    Require all denied
</FilesMatch>

<FilesMatch "\.(sqlite|sqlite3|db|log|ini|md)$">
    Require all denied
</FilesMatch>

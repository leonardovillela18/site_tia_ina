# Deixa a loja mabellebeauty.com.br fora do ar (503),
# mantendo o StockFlow em /sistema/ e os arquivos estaticos funcionando.
server {
    server_name mabellebeauty.com.br www.mabellebeauty.com.br;

    client_max_body_size 20M;

    location /static/ {
        alias /home/ubuntu/Loja/staticfiles/;
    }

    location /sistema/static/ {
        alias /home/ubuntu/StockFlow/staticfiles/;
    }

    location /media/ {
        alias /home/ubuntu/StockFlow/media/;
    }

    location /sistema/media/ {
        alias /home/ubuntu/StockFlow/media/;
    }

    location = /webhook/deploy/ {
        include proxy_params;
        proxy_pass http://127.0.0.1:8000/webhook/deploy/;
    }

    location /sistema/ {
        include proxy_params;
        proxy_pass http://127.0.0.1:8000/;
    }

    # Loja fora do ar
    location / {
        return 503;
    }

    error_page 503 @maintenance;
    location @maintenance {
        root /var/www/maintenance;
        try_files /index.html =503;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/mabellebeauty.com.br/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/mabellebeauty.com.br/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.mabellebeauty.com.br) {
        return 301 https://$host$request_uri;
    }

    if ($host = mabellebeauty.com.br) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name mabellebeauty.com.br www.mabellebeauty.com.br;
    return 404;
}

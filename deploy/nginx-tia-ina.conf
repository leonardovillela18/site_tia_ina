# Site Tia Iná servido pelo container (127.0.0.1:8090).
# Para usar um dominio, troque server_name pelo dominio e rode:
#   sudo certbot --nginx -d seudominio.com.br -d www.seudominio.com.br
server {
    listen 80;
    listen [::]:80;
    server_name 147.15.51.155;

    client_max_body_size 20M;
    server_tokens off;

    # Compressao para HTML/CSS/JS/JSON/XML
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/xml application/json
               application/javascript application/x-javascript image/svg+xml;

    # Cabecalhos de seguranca (o PHP tambem envia; aqui garantimos mesmo em estaticos)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Nunca expor o banco SQLite nem scripts internos
    location ^~ /data/ {
        return 403;
    }
    location ^~ /tools/ {
        return 404;
    }

    # Cache longo para imagens, CSS e JS (o PHP usa ?v= para invalidar)
    location ~* \.(?:webp|png|jpe?g|gif|svg|ico)$ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        access_log off;
    }
    location ~* \.(?:css|js)$ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

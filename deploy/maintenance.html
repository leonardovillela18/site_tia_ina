<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Site temporariamente indisponível</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #f7f3ec; color: #3b2f2a; padding: 24px;
  }
  .card {
    max-width: 520px; width: 100%; text-align: center;
    background: #fff; border-radius: 16px; padding: 48px 32px;
    box-shadow: 0 12px 40px rgba(59, 47, 42, .12);
  }
  .badge {
    display: inline-block; margin-bottom: 20px; padding: 6px 14px;
    border-radius: 999px; background: #f0e6d8; color: #8a6d3b;
    font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
  }
  h1 { margin: 0 0 12px; font-size: 26px; line-height: 1.25; }
  p { margin: 0 0 8px; color: #6b5a52; line-height: 1.6; }
  .muted { margin-top: 24px; font-size: 13px; color: #9a8a80; }
</style>
</head>
<body>
  <main class="card">
    <span class="badge">Em manutenção</span>
    <h1>Site temporariamente indisponível</h1>
    <p>Estamos ajustando a loja e voltamos em breve.</p>
    <p>Obrigado pela compreensão.</p>
    <p class="muted">Se precisar falar com a gente, use o contato habitual.</p>
  </main>
</body>
</html>

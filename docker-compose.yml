services:
  web:
    build: .
    image: tia-ina:latest
    container_name: tia_ina
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:80"
    environment:
      BASE_URL: ${BASE_URL:-http://localhost:8090}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Site Tia Iná}
    volumes:
      - ./data:/var/www/html/data
      - ./img:/var/www/html/img
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 80) ? 0 : 1);"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 192m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

name: Deploy VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-tia-ina
  cancel-in-progress: false

jobs:
  deploy:
    name: Atualizar /opt/tia-ina
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            cd "${{ secrets.VPS_PATH }}"
            git fetch --all --prune
            git reset --hard origin/main
            docker compose up -d --build
            docker compose exec -T web php tools/generate-images.php || true
            docker compose ps
            curl -fsS -o /dev/null -w "HTTP %{http_code}\n" http://127.0.0.1:8090/

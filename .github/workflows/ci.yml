name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: PHP 8.3 + SQLite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3, gd, mbstring, iconv, fileinfo
          coverage: none

      - name: Validar sintaxe de todos os arquivos PHP
        run: |
          find . -name '*.php' -not -path './vendor/*' -print0 \
            | xargs -0 -n1 -P4 php -l

      - name: Rodar testes
        run: php tests/run.php

      - name: Gerar variantes WebP (smoke test do GD)
        run: php tools/generate-images.php

  docker:
    name: Build da imagem
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - name: docker build
        run: docker build -t tia-ina:ci .
